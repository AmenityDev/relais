name: CI

on:
  push:
    branches: [main]
    # Release tags, which are what produce a semver-tagged image.
    tags: ["v*"]
  pull_request:
  # So a broken CI can be re-run without pushing an empty commit.
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The version comes from go.mod, so CI cannot drift from what the
          # project actually builds with.
          go-version-file: go.mod
          cache: true

      - name: The checkout is complete
        # A .gitignore pattern without a leading slash matches at any depth. A bare
        # "relais" once excluded cmd/relais from the repository, so this workflow
        # ran against a tree with no main package and three jobs failed with
        # "directory not found" rather than anything about the code. Fail here
        # instead, with a message that names the cause.
        run: |
          for d in cmd/relais internal deploy; do
            if [ ! -e "$d" ]; then
              echo "$d is missing from the checkout: something in .gitignore excludes it."
              echo "Check with: git check-ignore -v $d"
              exit 1
            fi
          done

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is up to date
        run: go mod tidy -diff

      - name: Committed OpenAPI documents match the code
        # The documents are generated from the structs that serve the requests, so
        # a handler whose response type changed without a regeneration would ship
        # TypeScript types that describe an API the server no longer has.
        run: |
          go run ./cmd/relais openapi -surface admin -check docs/openapi-admin.json
          go run ./cmd/relais openapi -surface public -check docs/openapi-public.json

      - name: The two Coolify compose files agree
        # deploy/coolify/ holds the same stack twice, with and without SMTP. A change
        # to the shared parts belongs in both, and nothing else would notice if it
        # landed in only one.
        run: python3 scripts/check-compose-variants.py

      - name: Generated query layer matches the queries
        # Catches the case where someone edits a .sql file and forgets to
        # regenerate: the committed Go would silently keep the old query.
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major version as production, so a behavioural difference cannot
        # hide between CI and the real database.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relais
          POSTGRES_PASSWORD: relais
          POSTGRES_DB: relais
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relais -d relais"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RELAIS_DB_URL: postgres://relais:relais@127.0.0.1:5432/relais?sslmode=disable
      # Setting this makes the database MANDATORY for the integration tests: an
      # unreachable one fails the run instead of skipping. Without it, a
      # misconfigured service container would produce a green build that tested
      # none of the pipeline, the store, or either façade — which is worse than a
      # red one, because nobody would look.
      # A separate database, as locally: the suite truncates every table, and sharing
      # one database with the migrated application schema is how a developer loses
      # their local setup.
      RELAIS_TEST_DB_URL: postgres://relais:relais@127.0.0.1:5432/relais_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: The checkout is complete
        # A .gitignore pattern without a leading slash matches at any depth. A bare
        # "relais" once excluded cmd/relais from the repository, so this workflow
        # ran against a tree with no main package and three jobs failed with
        # "directory not found" rather than anything about the code. Fail here
        # instead, with a message that names the cause.
        run: |
          for d in cmd/relais internal deploy; do
            if [ ! -e "$d" ]; then
              echo "$d is missing from the checkout: something in .gitignore excludes it."
              echo "Check with: git check-ignore -v $d"
              exit 1
            fi
          done

      - name: Create the test database
        run: |
          PGPASSWORD=relais createdb -h 127.0.0.1 -U relais -O relais relais_test
          PGPASSWORD=relais psql -h 127.0.0.1 -U relais -d relais_test -c 'SELECT 1' >/dev/null

      - name: Apply migrations
        # Migrations are never implicit in serve, so CI runs them as its own step,
        # exactly as a deployment does.
        run: go run ./cmd/relais migrate up

      - name: Apply migrations to the test database
        run: go run ./cmd/relais migrate up
        env:
          RELAIS_DB_URL: postgres://relais:relais@127.0.0.1:5432/relais_test?sslmode=disable

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Confirm the integration tests actually ran
        # A skip here would mean the suite silently stopped covering the database,
        # which is the failure mode RELAIS_TEST_DB_URL exists to prevent. Belt and
        # braces: assert it out loud rather than trusting the variable was read.
        run: |
          go test -count=1 -v -run 'TestEndToEndDelivery' ./internal/jobs/ | tee result.txt
          if grep -q '^--- SKIP' result.txt; then
            echo "The end-to-end delivery test skipped: the database was not reachable."
            exit 1
          fi
          grep -q '^--- PASS: TestEndToEndDelivery' result.txt

  fuzz:
    name: Fuzz the sender-pattern matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The pattern grammar decides what every credential is allowed to send as.
      # A short run on every change is cheap, and a crasher found here is found
      # before it reaches a deployment.
      - name: Fuzz Parse
        run: go test ./internal/frompattern/ -run=XXX -fuzz='^FuzzParse$' -fuzztime=45s

      - name: Fuzz the wildcard containment property
        run: |
          go test ./internal/frompattern/ -run=XXX \
            -fuzz='^FuzzParseAddressAgainstWildcardPattern$' -fuzztime=45s

      - name: Fuzz the message normalizer
        run: go test ./internal/mailnorm/ -run=XXX -fuzz='^FuzzParse$' -fuzztime=45s

      - name: Upload any crasher
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: |
            internal/frompattern/testdata/fuzz/
            internal/mailnorm/testdata/fuzz/
          if-no-files-found: ignore

  web:
    name: Admin interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to the same major as deploy/Dockerfile.web, so CI cannot pass on a
          # runtime the image does not use. package.json's engines field is a range
          # (">=22"), which would let CI drift ahead of the image.
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci, not install: it installs exactly the lockfile and fails when
      # package.json and the lock disagree, so CI cannot pass against dependencies
      # nobody committed.
      - name: Install
        run: npm ci

      - name: Generated API types match the OpenAPI document
        # The types are generated from the document, which is itself generated from
        # the Go structs. Without this check, a handler could change, the document be
        # regenerated, and the frontend keep compiling against the old shape — the
        # exact drift the whole chain exists to prevent, one link further along.
        #
        # The generator is not a dependency of the app: its TypeScript peer is ^5 and
        # the app needs 6 for svelte-check and typescript-eslint. Pinned here instead.
        run: |
          npx --yes openapi-typescript@7.13.0 ../docs/openapi-admin.json -o /tmp/expected.d.ts
          if ! diff -q /tmp/expected.d.ts src/lib/api.generated.d.ts; then
            echo "src/lib/api.generated.d.ts is out of date. Regenerate it with:"
            echo "  task web:types"
            diff -u src/lib/api.generated.d.ts /tmp/expected.d.ts | head -60
            exit 1
          fi

      - name: Type-check
        run: npm run check

      - name: Format
        run: npx --no-install prettier --check .

      - name: Lint
        run: npx --no-install eslint .

      - name: Test
        run: npm run test

      - name: Build
        # Configuration is validated as the server starts, not as it builds, so the
        # build needs none of it. Asserted here: a build that required secrets could
        # not be produced by CI at all.
        run: npm run build

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The checkout is complete
        # A .gitignore pattern without a leading slash matches at any depth. A bare
        # "relais" once excluded cmd/relais from the repository, so this workflow
        # ran against a tree with no main package and three jobs failed with
        # "directory not found" rather than anything about the code. Fail here
        # instead, with a message that names the cause.
        run: |
          for d in cmd/relais internal deploy; do
            if [ ! -e "$d" ]; then
              echo "$d is missing from the checkout: something in .gitignore excludes it."
              echo "Check with: git check-ignore -v $d"
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v4

      # Build only, never push: this job exists to catch a broken Dockerfile, and
      # publishing is a release decision rather than a CI one.
      - name: Build the backend for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the admin interface for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          # A separate cache scope: the two images share no layers, and one scope
          # would have them evicting each other.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  publish:
    name: Publish the images
    runs-on: ubuntu-latest

    # Every check, by name. A publish that could outrun the test job would defeat the
    # point of having one: this is the gate the whole workflow exists to feed.
    needs: [lint, test, fuzz, web, image]

    # Never from a pull request. A fork's PR would otherwise publish code nobody has
    # reviewed under this repository's name, and the token it gets could not push
    # anyway — failing late and confusingly instead of not running.
    if: github.event_name == 'push'

    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to ghcr.io. No secret to create, rotate,
      # or leak: the credential is scoped to this repository and expires with the run.
      packages: write

    strategy:
      # Both images are published even if one fails, so a broken frontend build does
      # not also withhold a good backend.
      fail-fast: false
      matrix:
        include:
          - name: relais
            dockerfile: deploy/Dockerfile
            cache-scope: backend
          - name: relais-web
            dockerfile: deploy/Dockerfile.web
            cache-scope: web

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history, so `git describe` can name a build.
          fetch-depth: 0

      - name: Describe the build
        id: version
        # The value baked into the binary and reported by `relais version`. A tag gives
        # its own name; a commit on main gives the nearest tag plus a distance and a
        # short sha, which is enough to find the exact source of a running container.
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # sha- is immutable and is what a rollback pins to. `main` moves, and is for
          # following the branch. `latest` is deliberately NOT on main: a self-hosted
          # deployment that follows `latest` should follow releases, not every commit.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=Self-hosted SMTP/API mail gateway with scoped sender credentials

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # Shared with the image job's scopes, so a push reuses what the pull request
          # already built rather than paying for both architectures twice.
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
          # Records how the image was built, which is what makes the published artefact
          # traceable to this workflow and this commit.
          provenance: mode=max
          sbom: true

      - name: Report what was published
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

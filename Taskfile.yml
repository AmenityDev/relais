# Task runner (https://taskfile.dev). Install with:
#   go install github.com/go-task/task/v3/cmd/task@latest
#
# Every recipe here is a plain command sequence, so nothing depends on task
# being installed: read a target and run it by hand if you prefer.

version: "3"

vars:
  MODULE: github.com/amenitydev/relais
  BIN: bin/relais
  IMAGE: relais
  # Overridden in CI with the release tag.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Create .env with freshly generated keys (safe to re-run)
    # The repository ships no key material, so a new checkout has to generate its
    # own. This is that step, kept to one command so nobody is tempted to paste a
    # key from somewhere public.
    cmds:
      - |
        set -e
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "created .env from .env.example"
        fi
        if grep -qE '^RELAIS_SECRET_ENCRYPTION_KEYS=.+' .env; then
          echo "RELAIS_SECRET_ENCRYPTION_KEYS is already set, leaving it alone"
        else
          key=$(go run ./cmd/relais keygen key 2>/dev/null)
          sed -i "s|^RELAIS_SECRET_ENCRYPTION_KEYS=.*|RELAIS_SECRET_ENCRYPTION_KEYS=$key|" .env
          echo "generated RELAIS_SECRET_ENCRYPTION_KEYS"
        fi
        if grep -qE '^RELAIS_SECRET_CREDENTIAL_PEPPER=.+' .env; then
          echo "RELAIS_SECRET_CREDENTIAL_PEPPER is already set, leaving it alone"
        else
          pepper=$(go run ./cmd/relais keygen pepper 2>/dev/null)
          sed -i "s|^RELAIS_SECRET_CREDENTIAL_PEPPER=.*|RELAIS_SECRET_CREDENTIAL_PEPPER=$pepper|" .env
          echo "generated RELAIS_SECRET_CREDENTIAL_PEPPER"
        fi
        # The interface needs its own key, and refuses to start without one. Leaving
        # it out of setup meant a fresh checkout could bring up relais and then hit a
        # wall at the admin interface, which is a poor place to discover a missing
        # step.
        if grep -qE '^RELAIS_WEB_SESSION_KEY=.+' .env; then
          echo "RELAIS_WEB_SESSION_KEY is already set, leaving it alone"
        else
          web=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))" 2>/dev/null) || {
            echo "RELAIS_WEB_SESSION_KEY: node is not installed, skipping."
            echo "  Generate one later with: task web:key"
            web=""
          }
          if [ -n "$web" ]; then
            sed -i "s|^RELAIS_WEB_SESSION_KEY=.*|RELAIS_WEB_SESSION_KEY=$web|" .env
            echo "generated RELAIS_WEB_SESSION_KEY"
          fi
        fi
        echo
        echo "Next: docker compose up -d && task migrate"
        echo "For the admin interface, point it at an OIDC issuer:"
        echo "  docker compose --profile auth up -d   # a development Keycloak"
        echo "  then set RELAIS_OIDC_ISSUER and RELAIS_WEB_OIDC_* in .env"

  build:
    desc: Build the binary
    cmds:
      - >
        CGO_ENABLED=0 go build -trimpath
        -ldflags "-s -w -X {{.MODULE}}/internal/obs.Version={{.VERSION}}"
        -o {{.BIN}} ./cmd/relais
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"

  test:
    desc: Run the test suite (database-backed tests skip if Postgres is down)
    # No RELAIS_TEST_DB_URL here: without it the database-backed tests skip rather
    # than touching anything. `task test:all` is the one that requires a database,
    # and it uses relais_test.
    cmds:
      - go test -race ./...

  test:db:
    desc: Create and migrate the test database (safe to re-run)
    cmds:
      - |
        set -e
        docker compose exec -T postgres psql -U relais -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='relais_test'" | grep -q 1 \
          || docker compose exec -T postgres createdb -U relais -O relais relais_test
        echo "relais_test is present"
      - RELAIS_DB_URL=postgres://relais:relais@127.0.0.1:5432/relais_test?sslmode=disable go run ./cmd/relais migrate up

  test:all:
    desc: Run everything, requiring a database (this is what CI should run)
    # Setting RELAIS_TEST_DB_URL makes the database mandatory: an unreachable one
    # fails instead of skipping, because a silently skipped integration suite
    # looks exactly like a passing one.
    env:
      # relais_test, never relais: the suite truncates every table between cases, so
      # pointing it at the development database wipes whatever was set up there.
      RELAIS_TEST_DB_URL: '{{.RELAIS_TEST_DB_URL | default "postgres://relais:relais@127.0.0.1:5432/relais_test?sslmode=disable"}}'
    cmds:
      - go test -race -count=1 ./...

  fuzz:
    desc: Fuzz the sender-pattern matcher (the security-critical parser)
    vars:
      TIME: '{{.TIME | default "60s"}}'
    cmds:
      - go test ./internal/frompattern/ -run=XXX -fuzz='^FuzzParse$' -fuzztime={{.TIME}}
      - go test ./internal/frompattern/ -run=XXX -fuzz='^FuzzParseAddressAgainstWildcardPattern$' -fuzztime={{.TIME}}

  lint:
    desc: Vet, format check and module tidiness
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - go mod tidy -diff
      - go run ./cmd/relais openapi -surface admin -check docs/openapi-admin.json
      - go run ./cmd/relais openapi -surface public -check docs/openapi-public.json

  openapi:
    desc: Regenerate the OpenAPI documents from the Go types
    cmds:
      - go run ./cmd/relais openapi -surface admin -o docs/openapi-admin.json
      - go run ./cmd/relais openapi -surface public -o docs/openapi-public.json
    sources:
      - internal/httpapi/*.go
    generates:
      - docs/openapi-admin.json
      - docs/openapi-public.json

  generate:
    desc: Regenerate the sqlc query layer
    cmds:
      - sqlc generate
    sources:
      - sqlc.yaml
      - internal/db/queries/*.sql
      - internal/db/migrations/*.sql
    generates:
      - internal/db/gen/*.go

  dev:up:
    desc: Start the development infrastructure (Postgres + a local SMTP sink)
    deps: [setup]
    cmds:
      - docker compose up -d
      - docker compose ps

  dev:auth:
    desc: Start the development OIDC provider (Keycloak, realm pre-imported)
    # Its own target rather than part of dev:up: the usual loop does not need an
    # identity provider, and Keycloak is the heaviest container here.
    cmds:
      - docker compose --profile auth up -d
      - |
        printf 'waiting for Keycloak to import its realm'
        for _ in $(seq 1 60); do
          if [ "$(docker inspect -f '{{`{{.State.Health.Status}}`}}' relais-dev-keycloak-1 2>/dev/null)" = healthy ]; then
            echo " ready"
            echo
            echo "issuer:  http://localhost:8180/realms/relais"
            echo "users:   ops/ops (admin), watcher/watcher (read-only)"
            echo "console: http://localhost:8180 (admin/admin)"
            exit 0
          fi
          printf '.'
          sleep 2
        done
        echo
        echo "Keycloak did not become healthy. Logs:"
        docker compose --profile auth logs --tail 30 keycloak
        exit 1

  dev:stop:
    desc: Stop every development container, keeping the data
    # Names both profiles: `docker compose down` alone leaves the profile-gated
    # containers running, which is how a stale Keycloak ends up holding :8180.
    cmds:
      - docker compose --profile auth --profile web --profile app down

  dev:down:
    desc: Stop the development infrastructure, keeping the data volume
    cmds:
      - docker compose down

  dev:reset:
    desc: Destroy the development database and recreate the schema
    prompt: This deletes the local database. Continue?
    cmds:
      # Every profile, or a Keycloak started earlier survives the reset and keeps a
      # port. Its realm is re-imported on each start, so it loses nothing.
      - docker compose --profile auth --profile web --profile app down -v
      - docker compose up -d
      # Wait for the healthcheck rather than sleeping a guessed number of
      # seconds.
      - until [ "$(docker inspect -f '{{`{{.State.Health.Status}}`}}' relais-dev-postgres-1)" = healthy ]; do sleep 1; done
      - task: migrate

  migrate:
    desc: Apply pending migrations
    cmds:
      - go run ./cmd/relais migrate up

  migrate:status:
    desc: Show migration status
    cmds:
      - go run ./cmd/relais migrate status

  serve:
    desc: Run the service against the development infrastructure
    cmds:
      - go run ./cmd/relais serve

  keys:
    desc: Print fresh key material for a new environment
    cmds:
      - go run ./cmd/relais keygen key
      - go run ./cmd/relais keygen pepper

  web:install:
    desc: Install the admin interface's dependencies
    dir: web
    cmds:
      - npm ci
    sources:
      - web/package.json
      - web/package-lock.json

  web:dev:
    desc: Run the admin interface against a local relais
    dir: web
    deps: [web:install]
    cmds:
      - npm run dev

  web:check:
    desc: Type-check, lint and test the admin interface
    dir: web
    deps: [web:install]
    cmds:
      - npm run check
      - npx --no-install prettier --check .
      - npx --no-install eslint .
      - npm run test

  web:types:
    desc: Regenerate the TypeScript types from the OpenAPI document
    deps: [openapi]
    dir: web
    cmds:
      - npm run types

  smoke:
    desc: Drive the running stack end to end (login, screens, RBAC)
    # Tests the running servers, not the source. Rebuild first: adapter-node loads
    # route chunks lazily, so rebuilding under a live process makes it 500 on routes
    # it had not loaded — a failure that looks like a bug and is not one.
    cmds:
      - bash scripts/smoke.sh

  web:key:
    desc: Generate a session key for the admin interface
    cmds:
      - node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"

  docker:build:
    desc: Build the production image for the local architecture
    cmds:
      - docker build -f deploy/Dockerfile --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} .

  web:docker:build:
    desc: Build the admin interface image
    cmds:
      - docker build -f deploy/Dockerfile.web --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}-web:{{.VERSION}} .

  docker:buildx:
    desc: Build and push the multi-arch image (set REGISTRY)
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "Set REGISTRY, e.g. REGISTRY=ghcr.io/you task docker:buildx"
    cmds:
      - >
        docker buildx build --platform linux/amd64,linux/arm64
        -f deploy/Dockerfile --build-arg VERSION={{.VERSION}}
        -t $REGISTRY/{{.IMAGE}}:{{.VERSION}} --push .

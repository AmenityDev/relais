# Development stack.
#
#   docker compose up -d              Postgres + a local SMTP sink
#   docker compose --profile app up   ...plus relais itself, built from source
#
# By default only the infrastructure runs, so that relais can be run from the
# host with `go run ./cmd/relais serve` and a debugger attached.
#
# This file is for development. Production runs the published images, configured
# entirely through the environment; see the README.

name: relais-dev

services:
  postgres:
    image: postgres:18-alpine
    # Survives a Docker daemon restart or a reboot, so the development stack does
    # not silently disappear between sessions. "unless-stopped" still respects an
    # explicit `docker compose stop`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: relais
      POSTGRES_PASSWORD: relais
      POSTGRES_DB: relais
      # Speeds up the initial cluster creation; irrelevant to production, where
      # the database is managed separately.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Published on loopback only: a development database must not be reachable
      # from the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Creates the separate relais_test database on first initialisation. See the
      # script: the suite truncates, and truncating the development data is not a
      # thing to discover by losing it.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
      # Postgres 18 images expect a single mount at /var/lib/postgresql and put
      # the cluster in a version-specific subdirectory, which is what makes
      # `pg_upgrade --link` possible later. Mounting .../data instead (the
      # pre-18 convention) leaves the volume unused and the data ephemeral.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relais -d relais"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Mailpit stands in for OCI Email Delivery: it accepts anything and shows the
  # result at http://127.0.0.1:8025. Register it as a backend with
  # `-tls none`, which the schema only allows because it carries no credentials.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  relais:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VERSION: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAIS_ENV: dev
      RELAIS_OBS_LOG_FORMAT: text
      RELAIS_OBS_LOG_LEVEL: debug
      RELAIS_DB_URL: postgres://relais:relais@postgres:5432/relais?sslmode=disable
      # Taken from the environment, or from .env which Compose reads on its own.
      # No default: a committed key is a key every reader of this repository has,
      # and the ":?" form fails the command with this message rather than starting
      # with one. Run `task setup` to generate a pair.
      RELAIS_SECRET_ENCRYPTION_KEYS: ${RELAIS_SECRET_ENCRYPTION_KEYS:?missing - run "task setup", or "relais keygen key" and put the value in .env}
      RELAIS_SECRET_CREDENTIAL_PEPPER: ${RELAIS_SECRET_CREDENTIAL_PEPPER:?missing - run "task setup", or "relais keygen pepper" and put the value in .env}
      # A generated certificate is fine here and is refused outright when
      # RELAIS_ENV is prod.
      RELAIS_TLS_SELF_SIGNED: "true"
      RELAIS_TLS_SELF_SIGNED_HOSTS: "localhost,127.0.0.1,relais"
    ports:
      - "127.0.0.1:8080:8080"
      # 587 outside, unprivileged 2525 inside: no capability needed.
      - "127.0.0.1:587:2525"
    # Migrations are a deliberate step, never implicit in serve.
    command: ["serve"]

  # An OIDC provider for development, so the admin interface can be exercised
  # without a production identity provider and without a local login bypass — a
  # development-only login is exactly the kind of thing that survives into
  # production.
  #
  # start-dev, never a production mode: no TLS, an in-memory H2 database, and a
  # realm imported from a fixture on every start. The realm carries a fixed client
  # secret and two throwaway passwords (ops/ops, watcher/watcher). Those are
  # fixtures for a loopback-only container, not key material: they unlock this
  # container and nothing else, and relais itself still ships no keys.
  keycloak:
    profiles: ["web", "auth"]
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The issuer must be identical in the browser and inside the network, or the
      # `iss` claim will not match what either side validates against. Fixing the
      # hostname is what makes one value work from both.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/relais-realm.json:/opt/keycloak/data/import/relais-realm.json:ro
    ports:
      - "127.0.0.1:8180:8180"
    healthcheck:
      # No shell and no curl in the image; Keycloak exposes its probes on the
      # management port, and its own JVM can be asked to check them.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The admin interface, containerised as it is deployed.
  #
  # For the local loop, prefer running it from the host:
  #
  #   docker compose --profile auth up -d      # Keycloak only
  #   task web:dev                             # SvelteKit on the host
  #
  # The reason is not convenience. An OIDC issuer URL has to resolve to the same
  # provider from the browser *and* from the server that exchanges the code, because
  # both sides deal in the same `iss` value. On a development machine the only name
  # that satisfies both is localhost, which a container cannot reach. Running the
  # server on the host makes localhost mean one thing everywhere.
  #
  # In a real deployment the provider has a real hostname and this stops mattering,
  # which is why the container itself is unchanged.
  relais-web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VERSION: dev
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # The admin listener, on the compose network. Never published.
      RELAIS_WEB_API_URL: http://relais:8081
      RELAIS_WEB_ORIGIN: http://localhost:3000
      # Passed through empty rather than with Compose's ${VAR:?} form. Compose
      # interpolates the whole file before it selects a profile, so a required
      # variable here would break `docker compose ps` and `up postgres` for someone
      # who never asked for this service. The container validates its own
      # configuration at startup and names every missing variable, which is a better
      # error anyway — and no key is defaulted, so nothing starts with a known one.
      # Defaults point at the development Keycloak above. Override any of them in
      # .env to use a real provider instead.
      RELAIS_WEB_OIDC_ISSUER: ${RELAIS_WEB_OIDC_ISSUER-http://localhost:8180/realms/relais}
      RELAIS_WEB_OIDC_CLIENT_ID: ${RELAIS_WEB_OIDC_CLIENT_ID-relais-web}
      RELAIS_WEB_OIDC_CLIENT_SECRET: ${RELAIS_WEB_OIDC_CLIENT_SECRET-dev-only-not-a-production-secret}
      # No default: a committed session key is a key every reader of this repository
      # could forge a session with. `task web:key` generates one.
      RELAIS_WEB_SESSION_KEY: ${RELAIS_WEB_SESSION_KEY-}
      # Plain HTTP on loopback only. config() refuses this for any other origin.
      RELAIS_WEB_INSECURE_COOKIE: "true"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
